<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Beer Quality App</title>
</head>
<body>

<h1>🍺 Parámetros de Calidad de Cerveza</h1>

<h2>Agregar parámetro</h2>
<form method="post">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Parámetro (pH, Alcohol)" required>
    <input type="number" step="0.01" name="value" placeholder="Valor" required>
    <input type="text" name="unit" placeholder="Unidad" required>
    <button type="submit">Guardar</button>
</form>

<hr>

<h2>Parámetros registrados</h2>
<ul>
    {% for p in parameters %}
        <li>{{ p.name }} → {{ p.value }} {{ p.unit }}</li>
    {% empty %}
        <li>No hay parámetros registrados</li>
    {% endfor %}
</ul>

</body>
</html>
